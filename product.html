<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07070b">
  <title>Product — SoloMarket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink:"#07070b", panel:"#101119", violet:"#8066ff" },
          animation: {
            float:"float 6s ease-in-out infinite",
            float2:"float2 5s ease-in-out infinite",
            pulseGlow:"pulseGlow 3s ease-in-out infinite"
          },
          keyframes: {
            float: { "0%,100%":{transform:"translateY(0) rotateY(0deg)"}, "50%":{transform:"translateY(-12px) rotateY(-6deg)"} },
            float2: { "0%,100%":{transform:"translateY(0)"}, "50%":{transform:"translateY(-10px)"} },
            pulseGlow: { "0%,100%":{opacity:".55"}, "50%":{opacity:"1"} }
          }
        }
      }
    }
  </script>
  <style>
    html{scroll-behavior:smooth}
    body{background:#07070b}
    ::selection{background:#8066ff55}
    .glass{background:rgba(255,255,255,.035);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}
    .grid-bg{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:42px 42px}
  </style>
</head>
<body class="min-h-screen bg-ink text-white antialiased">

<header class="sticky top-0 z-50 border-b border-white/10 bg-[#07070bcc] backdrop-blur-xl">
  <div class="mx-auto flex h-16 w-[min(1160px,calc(100%-28px))] items-center gap-5">
    <a href="index.html" class="mr-auto flex items-center gap-2 font-black tracking-tight">
      <span class="grid h-8 w-8 place-items-center rounded-xl bg-gradient-to-br from-violet-300 to-violet-600 shadow-[0_8px_30px_#8066ff55]">
        <span class="text-sm font-black">S</span>
      </span>
      <span>Solo<span class="text-violet-300">Market</span></span>
    </a>
    <nav class="hidden items-center gap-6 text-sm text-zinc-400 md:flex">
      <a class="transition hover:text-white" href="shop.html">Marketplace</a>
      <a class="transition hover:text-white" href="index.html#categories">Categories</a>
      <a class="transition hover:text-white" href="index.html#sell">Sell</a>
    </nav>
    <a href="login.html" class="hidden rounded-xl border border-white/10 px-3 py-2 text-xs font-bold hover:bg-white/5 sm:inline-flex">Login</a>
    <a href="register.html" class="rounded-xl bg-gradient-to-r from-violet-500 to-indigo-500 px-4 py-2.5 text-xs font-extrabold shadow-lg shadow-violet-500/20">Start selling</a>
  </div>
</header><main class="mx-auto w-[min(900px,calc(100%-28px))] py-12"><div id="product" class="py-20 text-center text-zinc-500">Loading…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script>(async()=>{let id=new URLSearchParams(location.search).get("id");let x=await soloSupabase.from("products").select("*").eq("id",id).eq("status","published").single();if(x.error)return product.innerHTML='<div class="rounded-2xl border border-red-400/20 bg-red-400/5 p-5 text-red-300">'+Solo.esc(x.error.message)+'</div>';let p=x.data;product.className="overflow-hidden rounded-3xl border border-white/10 bg-white/[.03]";product.innerHTML=`<div class="grid h-72 place-items-center bg-gradient-to-br from-violet-600 to-cyan-500 text-7xl">✦</div><div class="p-7 sm:p-10"><p class="text-xs font-black uppercase tracking-widest text-violet-300">${Solo.esc(p.category||"Digital Product")}</p><h1 class="mt-3 text-5xl font-black tracking-tight">${Solo.esc(p.title)}</h1><p class="mt-5 leading-7 text-zinc-400">${Solo.esc(p.description||"")}</p><div class="mt-8 flex flex-wrap items-center gap-4"><b class="text-2xl">${Solo.money(p.price,p.currency)}</b><button id="buy" class="rounded-xl bg-gradient-to-r from-violet-500 to-indigo-500 px-5 py-3 font-extrabold">Buy now →</button></div></div>`;buy.onclick=async()=>{let u=await Solo.requireAuth();if(!u)return;let o=await soloSupabase.from("orders").insert({buyer_id:u.id,total:p.price,status:"pending"}).select().single();if(o.error)return alert(o.error.message);let i=await soloSupabase.from("order_items").insert({order_id:o.data.id,product_id:p.id,quantity:1,unit_price:p.price,seller_id:p.seller_id});if(i.error)return alert(i.error.message);location.href="checkout.html?order="+o.data.id}})();</script>
</body>
</html>
