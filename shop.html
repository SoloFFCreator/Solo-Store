<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07070b">
  <title>Marketplace — SoloMarket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink:"#07070b", panel:"#101119", violet:"#8066ff" },
          animation: {
            float:"float 6s ease-in-out infinite",
            float2:"float2 5s ease-in-out infinite",
            pulseGlow:"pulseGlow 3s ease-in-out infinite"
          },
          keyframes: {
            float: { "0%,100%":{transform:"translateY(0) rotateY(0deg)"}, "50%":{transform:"translateY(-12px) rotateY(-6deg)"} },
            float2: { "0%,100%":{transform:"translateY(0)"}, "50%":{transform:"translateY(-10px)"} },
            pulseGlow: { "0%,100%":{opacity:".55"}, "50%":{opacity:"1"} }
          }
        }
      }
    }
  </script>
  <style>
    html{scroll-behavior:smooth}
    body{background:#07070b}
    ::selection{background:#8066ff55}
    .glass{background:rgba(255,255,255,.035);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}
    .grid-bg{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:42px 42px}
  </style>
</head>
<body class="min-h-screen bg-ink text-white antialiased">

<header class="sticky top-0 z-50 border-b border-white/10 bg-[#07070bcc] backdrop-blur-xl">
  <div class="mx-auto flex h-16 w-[min(1160px,calc(100%-28px))] items-center gap-5">
    <a href="index.html" class="mr-auto flex items-center gap-2 font-black tracking-tight">
      <span class="grid h-8 w-8 place-items-center rounded-xl bg-gradient-to-br from-violet-300 to-violet-600 shadow-[0_8px_30px_#8066ff55]">
        <span class="text-sm font-black">S</span>
      </span>
      <span>Solo<span class="text-violet-300">Market</span></span>
    </a>
    <nav class="hidden items-center gap-6 text-sm text-zinc-400 md:flex">
      <a class="transition hover:text-white" href="shop.html">Marketplace</a>
      <a class="transition hover:text-white" href="index.html#categories">Categories</a>
      <a class="transition hover:text-white" href="index.html#sell">Sell</a>
    </nav>
    <a href="login.html" class="hidden rounded-xl border border-white/10 px-3 py-2 text-xs font-bold hover:bg-white/5 sm:inline-flex">Login</a>
    <a href="register.html" class="rounded-xl bg-gradient-to-r from-violet-500 to-indigo-500 px-4 py-2.5 text-xs font-extrabold shadow-lg shadow-violet-500/20">Start selling</a>
  </div>
</header>
<main class="mx-auto w-[min(1160px,calc(100%-28px))] py-12 sm:py-16">
<p class="text-xs font-black uppercase tracking-[.2em] text-violet-300">Marketplace</p>
<h1 class="mt-4 text-5xl font-black tracking-[-.06em] sm:text-7xl">Find your next project.</h1>
<p class="mt-5 max-w-2xl text-zinc-400">Search products from independent creators.</p>
<div class="mt-8 grid gap-3 sm:grid-cols-[1fr_180px]"><input id="search" class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-white outline-none focus:border-violet-400" placeholder="Search products…"><select id="sort" class="rounded-xl border border-white/10 bg-[#101119] px-4 py-3 text-white outline-none"><option value="new">Newest</option><option value="low">Price low → high</option><option value="high">Price high → low</option></select></div>
<div id="products" class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-4"><div class="col-span-full py-16 text-center text-zinc-500">Loading…</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script>
let all=[];
async function load(){let x=await soloSupabase.from("products").select("*").eq("status","published").order("created_at",{ascending:false});if(x.error)return products.innerHTML='<div class="col-span-full rounded-2xl border border-red-400/20 bg-red-400/5 p-5 text-red-300">'+Solo.esc(x.error.message)+'</div>';all=x.data||[];render()}
function render(){let q=search.value.toLowerCase().trim(),a=all.filter(p=>(p.title+" "+(p.description||"")).toLowerCase().includes(q));if(sort.value==="low")a.sort((x,y)=>x.price-y.price);if(sort.value==="high")a.sort((x,y)=>y.price-x.price);products.innerHTML=a.length?a.map(p=>`<a href="product.html?id=${p.id}" class="group overflow-hidden rounded-2xl border border-white/10 bg-white/[.03] transition hover:-translate-y-2 hover:border-violet-400/40"><div class="grid h-40 place-items-center bg-gradient-to-br from-violet-600 to-cyan-500 text-4xl">✦</div><div class="p-4"><small class="text-[9px] font-black uppercase tracking-widest text-violet-300">${Solo.esc(p.category||"Digital Product")}</small><h3 class="mt-2 font-bold">${Solo.esc(p.title)}</h3><p class="mt-2 min-h-10 text-xs leading-5 text-zinc-500">${Solo.esc(p.description||"")}</p><div class="mt-4 flex justify-between"><b>${Solo.money(p.price,p.currency)}</b><span class="text-xs text-zinc-500">View →</span></div></div></a>`).join(""):'<div class="col-span-full py-16 text-center text-zinc-500">No products found.</div>'}
search.oninput=render;sort.onchange=render;load();
</script>
</body>
</html>
