<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth card"><h1>Login</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="go" class="btn">Login</button><p id="msg"></p><a href="register.html">Create account</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script>go.onclick=async()=>{try{await SoloAuth.signIn(email.value,password.value);location.href='dashboard/index.html'}catch(e){msg.textContent=e.message}}</script></body></html>
