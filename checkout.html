<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07070b">
  <title>Checkout — SoloMarket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink:"#07070b", panel:"#101119", violet:"#8066ff" },
          animation: {
            float:"float 6s ease-in-out infinite",
            float2:"float2 5s ease-in-out infinite",
            pulseGlow:"pulseGlow 3s ease-in-out infinite"
          },
          keyframes: {
            float: { "0%,100%":{transform:"translateY(0) rotateY(0deg)"}, "50%":{transform:"translateY(-12px) rotateY(-6deg)"} },
            float2: { "0%,100%":{transform:"translateY(0)"}, "50%":{transform:"translateY(-10px)"} },
            pulseGlow: { "0%,100%":{opacity:".55"}, "50%":{opacity:"1"} }
          }
        }
      }
    }
  </script>
  <style>
    html{scroll-behavior:smooth}
    body{background:#07070b}
    ::selection{background:#8066ff55}
    .glass{background:rgba(255,255,255,.035);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}
    .grid-bg{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:42px 42px}
  </style>
</head>
<body class="min-h-screen bg-ink text-white antialiased">

<header class="sticky top-0 z-50 border-b border-white/10 bg-[#07070bcc] backdrop-blur-xl">
  <div class="mx-auto flex h-16 w-[min(1160px,calc(100%-28px))] items-center gap-5">
    <a href="index.html" class="mr-auto flex items-center gap-2 font-black tracking-tight">
      <span class="grid h-8 w-8 place-items-center rounded-xl bg-gradient-to-br from-violet-300 to-violet-600 shadow-[0_8px_30px_#8066ff55]">
        <span class="text-sm font-black">S</span>
      </span>
      <span>Solo<span class="text-violet-300">Market</span></span>
    </a>
    <nav class="hidden items-center gap-6 text-sm text-zinc-400 md:flex">
      <a class="transition hover:text-white" href="shop.html">Marketplace</a>
      <a class="transition hover:text-white" href="index.html#categories">Categories</a>
      <a class="transition hover:text-white" href="index.html#sell">Sell</a>
    </nav>
    <a href="login.html" class="hidden rounded-xl border border-white/10 px-3 py-2 text-xs font-bold hover:bg-white/5 sm:inline-flex">Login</a>
    <a href="register.html" class="rounded-xl bg-gradient-to-r from-violet-500 to-indigo-500 px-4 py-2.5 text-xs font-extrabold shadow-lg shadow-violet-500/20">Start selling</a>
  </div>
</header><main class="mx-auto w-[min(900px,calc(100%-28px))] py-14"><p class="text-xs font-black uppercase tracking-widest text-violet-300">Checkout</p><h1 class="mt-4 text-5xl font-black">Complete your purchase.</h1><div id="checkout" class="mt-8 rounded-2xl border border-white/10 bg-white/[.03] p-7"><p class="text-zinc-500">Loading order…</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script>(async()=>{let u=await Solo.requireAuth();if(!u)return;let id=new URLSearchParams(location.search).get("order");let x=await soloSupabase.from("orders").select("*").eq("id",id).eq("buyer_id",u.id).single();if(x.error)return checkout.innerHTML='<p class="text-red-300">'+Solo.esc(x.error.message)+'</p>';checkout.innerHTML=`<p class="text-zinc-400">Order</p><h2 class="mt-2 text-2xl font-black">#${Solo.esc(id.slice(0,8))}</h2><p class="mt-4 text-zinc-400">Total: <b class="text-white">${Solo.money(x.data.total)}</b></p><p class="mt-6 text-sm leading-6 text-zinc-500">The seller's configured payment QR and payment screenshot submission flow should be shown here after the seller QR is connected.</p>`})();</script>
</body>
</html>
