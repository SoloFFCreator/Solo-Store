<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth card"><h1>Create account</h1><input id="name" placeholder="Name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" minlength="6" placeholder="Password"><button id="go" class="btn">Register</button><p id="msg"></p><a href="login.html">Login</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script>go.onclick=async()=>{try{await SoloAuth.signUp(email.value,password.value,name.value);msg.textContent='Account created. Check email if confirmation is enabled.'}catch(e){msg.textContent=e.message}}</script></body></html>
