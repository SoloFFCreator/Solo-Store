<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07070b">
  <title>Register — SoloMarket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink:"#07070b", panel:"#101119", violet:"#8066ff" },
          animation: {
            float:"float 6s ease-in-out infinite",
            float2:"float2 5s ease-in-out infinite",
            pulseGlow:"pulseGlow 3s ease-in-out infinite"
          },
          keyframes: {
            float: { "0%,100%":{transform:"translateY(0) rotateY(0deg)"}, "50%":{transform:"translateY(-12px) rotateY(-6deg)"} },
            float2: { "0%,100%":{transform:"translateY(0)"}, "50%":{transform:"translateY(-10px)"} },
            pulseGlow: { "0%,100%":{opacity:".55"}, "50%":{opacity:"1"} }
          }
        }
      }
    }
  </script>
  <style>
    html{scroll-behavior:smooth}
    body{background:#07070b}
    ::selection{background:#8066ff55}
    .glass{background:rgba(255,255,255,.035);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}
    .grid-bg{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:42px 42px}
  </style>
</head>
<body class="min-h-screen bg-ink text-white antialiased">
<main class="grid min-h-screen place-items-center bg-[radial-gradient(circle_at_50%_0%,#8066ff22,transparent_35rem)] p-5"><div class="w-full max-w-md rounded-3xl border border-white/10 bg-white/[.035] p-7 shadow-2xl backdrop-blur-xl sm:p-9"><a class="flex items-center justify-center gap-2 font-black" href="index.html"><span class="grid h-8 w-8 place-items-center rounded-xl bg-gradient-to-br from-violet-300 to-violet-600">S</span>Solo<span class="text-violet-300">Market</span></a><p class="mt-8 text-xs font-black uppercase tracking-widest text-violet-300">Join the marketplace</p><h1 class="mt-3 text-4xl font-black">Create account.</h1><form id="form" class="mt-7 grid gap-3"><input id="name" class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 outline-none focus:border-violet-400" placeholder="Display name" required><input id="email" class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 outline-none focus:border-violet-400" type="email" placeholder="Email" required><input id="password" class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 outline-none focus:border-violet-400" type="password" minlength="6" placeholder="Password" required><button class="mt-2 rounded-xl bg-gradient-to-r from-violet-500 to-indigo-500 px-5 py-3 font-extrabold">Create account</button></form><p id="msg" class="mt-4 text-sm text-zinc-500"></p><p class="mt-5 text-sm text-zinc-500">Already registered? <a class="text-violet-300" href="login.html">Sign in</a></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script>form.onsubmit=async e=>{e.preventDefault();let x=await soloSupabase.auth.signUp({email:email.value,password:password.value,options:{data:{display_name:name.value.trim()}}});if(x.error){msg.className="mt-4 text-sm text-red-300";msg.textContent=x.error.message}else{msg.className="mt-4 text-sm text-emerald-300";msg.textContent="Account created. Check your email if confirmation is enabled."}};</script>
</body>
</html>
