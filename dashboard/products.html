<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07070b">
  <title>Products — SoloMarket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink:"#07070b", panel:"#101119", violet:"#8066ff" },
          animation: {
            float:"float 6s ease-in-out infinite",
            float2:"float2 5s ease-in-out infinite",
            pulseGlow:"pulseGlow 3s ease-in-out infinite"
          },
          keyframes: {
            float: { "0%,100%":{transform:"translateY(0) rotateY(0deg)"}, "50%":{transform:"translateY(-12px) rotateY(-6deg)"} },
            float2: { "0%,100%":{transform:"translateY(0)"}, "50%":{transform:"translateY(-10px)"} },
            pulseGlow: { "0%,100%":{opacity:".55"}, "50%":{opacity:"1"} }
          }
        }
      }
    }
  </script>
  <style>
    html{scroll-behavior:smooth}
    body{background:#07070b}
    ::selection{background:#8066ff55}
    .glass{background:rgba(255,255,255,.035);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}
    .grid-bg{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:42px 42px}
  </style>
</head>
<body class="min-h-screen bg-ink text-white antialiased">

<header class="sticky top-0 z-50 border-b border-white/10 bg-[#07070bcc] backdrop-blur-xl">
  <div class="mx-auto flex h-16 w-[min(1160px,calc(100%-28px))] items-center gap-5">
    <a href="../index.html" class="mr-auto flex items-center gap-2 font-black tracking-tight">
      <span class="grid h-8 w-8 place-items-center rounded-xl bg-gradient-to-br from-violet-300 to-violet-600 shadow-[0_8px_30px_#8066ff55]">
        <span class="text-sm font-black">S</span>
      </span>
      <span>Solo<span class="text-violet-300">Market</span></span>
    </a>
    <nav class="hidden items-center gap-6 text-sm text-zinc-400 md:flex">
      <a class="transition hover:text-white" href="../shop.html">Marketplace</a>
      <a class="transition hover:text-white" href="../index.html#categories">Categories</a>
      <a class="transition hover:text-white" href="../index.html#sell">Sell</a>
    </nav>
    <a href="../login.html" class="hidden rounded-xl border border-white/10 px-3 py-2 text-xs font-bold hover:bg-white/5 sm:inline-flex">Login</a>
    <a href="../register.html" class="rounded-xl bg-gradient-to-r from-violet-500 to-indigo-500 px-4 py-2.5 text-xs font-extrabold shadow-lg shadow-violet-500/20">Start selling</a>
  </div>
</header><main class="mx-auto w-[min(1160px,calc(100%-28px))] py-12"><p class="text-xs font-black uppercase tracking-[.2em] text-violet-300">Seller center</p><h1 class="mt-4 text-5xl font-black tracking-tight">Products.</h1><div class="mt-8 grid gap-5 lg:grid-cols-[210px_1fr]"><aside class="rounded-2xl border border-white/10 bg-white/[.03] p-2 lg:sticky lg:top-24 lg:h-max"><a class="block rounded-xl px-3 py-2 text-sm text-zinc-400 hover:bg-white/5 hover:text-white" href="index.html">Overview</a><a class="block rounded-xl px-3 py-2 text-sm text-zinc-400 hover:bg-white/5 hover:text-white" href="products.html">Products</a><a class="block rounded-xl px-3 py-2 text-sm text-zinc-400 hover:bg-white/5 hover:text-white" href="orders.html">Payments</a><a class="block rounded-xl px-3 py-2 text-sm text-zinc-400 hover:bg-white/5 hover:text-white" href="downloads.html">Purchases</a><a class="block rounded-xl px-3 py-2 text-sm text-zinc-400 hover:bg-white/5 hover:text-white" href="analytics.html">Analytics</a><a class="block rounded-xl px-3 py-2 text-sm text-zinc-400 hover:bg-white/5 hover:text-white" href="settings.html">Payment QR</a></aside><section><div class="rounded-2xl border border-white/10 bg-white/[.03] p-6"><h2 class="text-xl font-bold">Add digital product</h2><form id="form" class="mt-5 grid gap-3"><input id="title" class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 outline-none focus:border-violet-400" placeholder="Product title" required><textarea id="description" class="min-h-28 rounded-xl border border-white/10 bg-white/5 px-4 py-3 outline-none focus:border-violet-400" placeholder="Description"></textarea><input id="price" class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 outline-none focus:border-violet-400" type="number" min="0" placeholder="Price" required><select id="currency" class="rounded-xl border border-white/10 bg-[#101119] px-4 py-3"><option>NPR</option><option>USD</option></select><input id="file" class="rounded-xl border border-white/10 bg-white/5 p-3 text-sm" type="file" required><button class="rounded-xl bg-gradient-to-r from-violet-500 to-indigo-500 px-5 py-3 font-extrabold">Upload product</button></form><p id="msg" class="mt-4 text-sm"></p></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script>(async()=>{let u=await Solo.requireAuth();if(!u)return;form.onsubmit=async e=>{e.preventDefault();try{let f=file.files[0],titleValue=title.value.trim();if(!f)throw Error("Choose a product file.");let base=Solo.slug(titleValue)||"product";/* IMPORTANT: products.slug is NOT NULL */let slug=base+"-"+crypto.randomUUID().slice(0,8);let x=await soloSupabase.from("products").insert({seller_id:u.id,title:titleValue,slug:slug,description:description.value.trim(),price:Number(price.value),currency:currency.value,status:"draft"}).select().single();if(x.error)throw x.error;let path=`${u.id}/${x.data.id}/${crypto.randomUUID()}-${f.name}`;let up=await soloSupabase.storage.from("digital-products").upload(path,f,{upsert:false});if(up.error)throw up.error;let fr=await soloSupabase.from("product_files").insert({product_id:x.data.id,storage_path:path,file_name:f.name,file_size:f.size,mime_type:f.type||"application/octet-stream"});if(fr.error)throw fr.error;msg.className="mt-4 text-sm text-emerald-300";msg.textContent="Product created successfully. Slug: "+slug;form.reset()}catch(e){msg.className="mt-4 text-sm text-red-300";msg.textContent=e.message}}})();</script>
</body>
</html>
