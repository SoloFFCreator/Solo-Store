<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="container"><h1>Analytics</h1><div class="grid"><div class="card"><h2 id="p">—</h2><small>Products</small></div><div class="card"><h2 id="o">—</h2><small>Paid orders</small></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script>;(async()=>{let u=await SoloAuth.requireAuth();if(!u)return;let a=await soloSupabase.from('products').select('id',{count:'exact',head:true}).eq('seller_id',u.id);let b=await soloSupabase.from('order_items').select('id,orders!inner(status)',{count:'exact',head:true}).eq('seller_id',u.id).eq('orders.status','paid');p.textContent=a.count||0;o.textContent=b.count||0})()</script></body></html>
